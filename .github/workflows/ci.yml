name: CI

on:
  push:
    branches:
      - main
      - next-0.1.0
      - experimental
  pull_request:
    branches:
      - main
      - next-0.1.0
      - experimental

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  gate:
    name: Quality gate (win-x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Quick quality gate
        run: node scripts/test-all.js --quick --rid win-x64

      - name: Publish E2E flavor
        run: node scripts/dotnet-build.js --rid win-x64 --flavor e2e

      - name: Run E2E suite
        continue-on-error: false
        run: node scripts/test-e2e.js --rid win-x64 --flavor e2e

      - name: Upload gate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-result
          path: artifacts/gate/result.json
          if-no-files-found: ignore

      - name: Upload E2E result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-result
          path: artifacts/e2e/result.json
          if-no-files-found: ignore
