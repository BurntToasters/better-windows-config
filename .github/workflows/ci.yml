name: CI

on:
  push:
    branches:
      - main
      - next-*
      - experimental
  pull_request:
    branches:
      - main
      - next-*
      - experimental

permissions:
  contents: read

# Only non-main runs are cancelled by a newer push. A release gate run on main always finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI: true

jobs:
  gate:
    name: Quality gate (win-x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Quick quality gate
        run: node scripts/test-all.js --quick --rid win-x64

      - name: Publish E2E flavor
        run: node scripts/dotnet-build.js --rid win-x64 --flavor e2e

      - name: Run E2E suite
        continue-on-error: false
        run: node scripts/test-e2e.js --rid win-x64 --flavor e2e

      - name: Installer update E2E (real NSIS installer)
        shell: pwsh
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path -LiteralPath $nsis)) {
            choco install nsis -y --no-progress
          }
          node scripts/test-installer-e2e.js --rid win-x64
          exit $LASTEXITCODE

      - name: Upload gate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-result
          path: artifacts/gate/result.json
          if-no-files-found: ignore

      - name: Upload E2E result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-result
          path: artifacts/e2e/result-win-x64-e2e.json
          if-no-files-found: ignore
