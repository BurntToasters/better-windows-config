name: CI

on:
  push:
    branches:
      - main
      - next-*
      - experimental
  pull_request:
    branches:
      - main
      - next-*
      - experimental

permissions:
  contents: read

# Only non-main runs are cancelled by a newer push. A release gate run on main always finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI: true

jobs:
  gate:
    name: Quality gate (win-x64)
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Quick quality gate
        run: node scripts/test-all.js --quick --rid win-x64

      - name: Publish E2E flavor
        run: node scripts/dotnet-build.js --rid win-x64 --flavor e2e

      # The hosted desktop captures black pixels and is 1024x768, so GUI checks are informational here.
      # The release gate is the local full gate on a real desktop (docs/failure-modes/quality-gate.md).
      - name: Run E2E suite
        id: e2e_suite
        continue-on-error: true
        timeout-minutes: 35
        run: node scripts/test-e2e.js --rid win-x64 --flavor e2e

      - name: Installer update E2E (real NSIS installer)
        id: installer_e2e
        continue-on-error: true
        timeout-minutes: 20
        shell: pwsh
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path -LiteralPath $nsis)) {
            choco install nsis -y --no-progress --version=3.13.0
          }
          node scripts/test-installer-e2e.js --rid win-x64
          exit $LASTEXITCODE

      - name: Upload gate result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-result
          path: artifacts/gate/result.json
          if-no-files-found: ignore

      - name: Upload E2E result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-result
          path: |
            artifacts/e2e/result-win-x64-e2e.json
            artifacts/e2e/installer-update.json
          if-no-files-found: ignore

      # The two E2E steps above keep continue-on-error, so a red one would look green. Name each failed one.
      - name: Report E2E step failures
        if: always()
        shell: bash
        env:
          E2E_SUITE_OUTCOME: ${{ steps.e2e_suite.outcome }}
          INSTALLER_E2E_OUTCOME: ${{ steps.installer_e2e.outcome }}
        run: |
          if [ "$E2E_SUITE_OUTCOME" = "failure" ]; then
            echo "::warning title=E2E step failed::Run E2E suite failed. It is informational on the hosted runner, but check the e2e-result artifact."
          fi
          if [ "$INSTALLER_E2E_OUTCOME" = "failure" ]; then
            echo "::warning title=E2E step failed::Installer update E2E (real NSIS installer) failed. It is informational on the hosted runner, but check the e2e-result artifact."
          fi
